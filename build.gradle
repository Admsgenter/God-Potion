plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version
base.archivesName = mod_name+"-Forge-"+minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    main {
        java.setSrcDirs(["src/${minecraft_version}/java"])
    }
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

minecraft {
    mappings channel: "official", version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs "-Dmixin.env.disableRefMap=true"

            mods {
                "${mod_id}" {
                    sources sourceSets as List
                }
            }
        }

        client {
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

processResources.filesMatching("META-INF/mods.toml") {expand project.properties as Map}

jar.finalizedBy("reobfJar")